          - generic [ref=e170]:
            - heading "Kitesurfing & Surf Lessons" [level=2] [ref=e171]
            - paragraph [ref=e172]: Playa Cosón and El Portillo both have consistent wind and surf, with local instructors available for all levels. Kitesurfing schools operate year-round with equipment rental included. If you've never tried it, the wide empty beaches here are as good a place as any to start.
