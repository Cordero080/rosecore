        - generic [ref=e105]:
          - img "Playa Rincón Day Trip" [ref=e107]
          - generic [ref=e108]:
            - heading "Playa Rincón Day Trip" [level=2] [ref=e109]
            - paragraph [ref=e110]: Consistently ranked among the top beaches in the Caribbean — and difficult to reach, which is exactly why it stays pristine. Three kilometres of white sand, a river at one end, coconut palms the whole way. Go by boat for the full arrival experience. Bring lunch, or eat at the small local spots on the beach.
