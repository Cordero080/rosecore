          - generic [ref=e118]: Half day or full day
          - generic [ref=e119]: Year-round
        - generic [ref=e120]:
          - img "Snorkeling & Private Boat Charter" [ref=e122]
          - generic [ref=e123]:
            - heading "Snorkeling & Private Boat Charter" [level=2] [ref=e124]
            - paragraph [ref=e125]: Charter a local boat and pick your own route — hidden coves, shallow reefs, and beaches only accessible by sea. The water off the Samaná Peninsula is clear enough to see coral formations and sea turtles from the surface. Best arranged through a local guide who knows the spots that don't appear on any map.
