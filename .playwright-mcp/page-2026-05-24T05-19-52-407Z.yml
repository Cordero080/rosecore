        - generic [ref=e59]:
          - img "Humpback Whale Watching" [ref=e61]
          - generic [ref=e62]:
            - heading "Humpback Whale Watching" [level=2] [ref=e63]
            - paragraph [ref=e64]: Every year, thousands of humpback whales migrate to Samaná Bay to breed — one of the highest concentrations on the planet. You'll hear them before you see them. A local guide boat takes you close enough to watch them breach, and sometimes close enough to feel the spray. There is nothing else like this in the Caribbean.
