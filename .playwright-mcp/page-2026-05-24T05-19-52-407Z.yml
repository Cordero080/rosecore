          - generic [ref=e135]: Year-round
        - generic [ref=e136]:
          - img "ATV & Coffee Plantation Tour" [ref=e138]
          - generic [ref=e139]:
            - heading "ATV & Coffee Plantation Tour" [level=2] [ref=e140]
            - paragraph [ref=e141]: Ride ATVs through jungle trails into the hills above Las Terrenas, stopping at local farms where cacao, coffee, and tropical fruit are grown. You'll taste things straight from the tree. A reminder that this island produces some of the finest cacao and coffee in the world, and almost none of it gets exported.
