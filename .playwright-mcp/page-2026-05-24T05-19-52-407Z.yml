          - generic [ref=e155]:
            - heading "Zipline in the Rainforest" [level=2] [ref=e156]
            - paragraph [ref=e157]: Over two kilometres of zipline cables through the forest canopy above Las Terrenas. The views open up between the trees — ocean on one side, mountains on the other. A good option for families or anyone who wants a rush without going far.
