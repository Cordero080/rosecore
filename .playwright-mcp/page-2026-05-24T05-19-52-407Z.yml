              - listitem [ref=e66]: Seasonal
              - listitem [ref=e67]: Wildlife
              - listitem [ref=e68]: Boat tour
      - listitem [ref=e69]:
        - generic [ref=e70]:
          - generic [ref=e71]: "02"
          - generic [ref=e72]: Half day
          - generic [ref=e73]: Year-round
        - generic [ref=e74]:
          - img "Salto El Limón" [ref=e76]
          - generic [ref=e77]:
            - heading "Salto El Limón" [level=2] [ref=e78]
            - paragraph [ref=e79]: A 40-metre waterfall deep in the jungle hills of Samaná, reached by horseback on a trail through banana trees and bamboo groves. The pool at the base is cold, clear, and completely hidden from the world. About 30 minutes from the residence. One of the best half-days you can spend on the peninsula.
