      - listitem [ref=e84]:
        - generic [ref=e85]:
          - generic [ref=e86]: "03"
          - generic [ref=e87]: Full day
          - generic [ref=e88]: Year-round
        - generic [ref=e89]:
          - img "Los Haitises National Park" [ref=e91]
          - generic [ref=e92]:
            - heading "Los Haitises National Park" [level=2] [ref=e93]
            - paragraph [ref=e94]: A vast protected wilderness of mangroves, limestone karst formations, and caves lined with Taíno petroglyphs. Over 230 bird species, including several endemic to the Dominican Republic. Reached by boat through channels of ancient green forest. Bring a camera and a full day.
